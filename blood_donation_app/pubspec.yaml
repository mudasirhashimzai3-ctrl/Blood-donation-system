name: blood_donation_app
description: A blood donation management system app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking
  dio: ^5.6.0
  pretty_dio_logger: ^1.4.0

  # Local Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Navigation
  go_router: ^14.2.7

  # Dependency Injection
  get_it: ^8.0.2
  injectable: ^2.4.4

  # UI & Utils
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  toastification: ^2.1.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  intl: ^0.20.2

  # Form & Validation
  reactive_forms: ^17.0.1

  # Connectivity
  connectivity_plus: ^6.0.5
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
